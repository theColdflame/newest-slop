<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoD5e Dynamic Tile Tracker - Foundry VTT v14 Module</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wod: {
              blood: '#8b0000',
              crimson: '#dc2626',
              dark: '#0f0f13',
              card: '#181820',
              accent: '#991b1b',
              gold: '#d97706',
              purple: '#581c87',
            }
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'serif'],
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Importmap -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
      "jszip": "https://esm.sh/jszip@3.10.1"
    }
  }
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Styles for Foundry VTT Theme Simulation -->
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    
    .foundry-glass {
      background: rgba(24, 24, 32, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(220, 38, 38, 0.25);
    }

    .wod-glow-red {
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.35);
    }
    
    .wod-glow-gold {
      box-shadow: 0 0 15px rgba(217, 119, 6, 0.3);
    }

    /* Grid canvas pattern */
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }
  </style>
</head>
<body class="h-full font-sans antialiased bg-slate-950 text-slate-100 flex flex-col overflow-x-hidden">
  <div id="root" class="h-full flex flex-col"></div>
  <script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>
</body>
</html>
